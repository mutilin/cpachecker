sv-benchmarks main:
  config: "-predicateAnalysis-threadmodular"
  setprop: 
    - "limits.time.cpu=900s"
    - "shutdown.timeout=1000"
    - "cpa.thread.supportSelfCreation=true"
  spec: "sv-comp-reachability"
  benchmarks: 
    - ldv-linux-3.14-races/*.i
    - ldv-races/*.i
    - pthread/*.i
    - pthread-atomic/*.i
    - pthread-ext/*.i
    - pthread-lit/*.i
    - pthread-nondet/*.i
    - pthread-driver-races/*.i
  verdicts: ci-config/sv-benchmarks-verdicts.yml
  parallel: True
  prefix: /opt/sv-benchmarks
