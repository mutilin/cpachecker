# fast check of different options on ldv-races
sv-benchmarks refinement:
  config: "-predicateAnalysis-threadmodular-refinement"
  setprop: 
    - "limits.time.cpu=900s"
    - "shutdown.timeout=1000"
    - "cpa.thread.handleSameThreads=SUPPORT"
  spec: "sv-comp-reachability"
  benchmarks: 
    - ldv-races/*.i
  verdicts: ci-config/sv-benchmarks-verdicts.yml
  parallel: True
  prefix: /opt/sv-benchmarks/
