    - "CompositeCPA.cpas=cpa.location.LocationCPA,cpa.callstack.CallstackCPA,cpa.lock.LockCPA,cpa.predicate.PredicateCPA"
    - "cpa.usage.unsafedetector.ignoreEmptyLockset=false"
  benchmarks: test/programs/cpalockator/simple/*.c
  verdicts: ci-config/simple-test-verdicts.yml
lockStatistics deadlocks:
  config: -lockator-deadlocks-linux
  benchmarks: test/programs/cpalockator/deadlocks/*.c
  verdicts: ci-config/deadlocks-test-verdicts.yml
