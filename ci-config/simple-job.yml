# Note, there is no threads
lockStatistics-linux:
  config: lockStatistics-linux.properties
  setprop: 
    - "CompositeCPA.cpas=cpa.location.LocationCPA,cpa.callstack.CallstackCPA,cpa.lock.LockCPA,cpa.predicate.BAMPredicateCPA"
    - "cpa.usage.unsafedetector.ignoreEmptyLockset=false"
  benchmarks: test/programs/cpalockator/simple/*.c
  verdicts: ci-config/simple-test-verdicts.yml
  wip: false
lockStatistics-linux-lightweight:
  config: lockStatistics-linux-lightweight.properties
  setprop: 
    - "CompositeCPA.cpas=cpa.location.LocationCPA,cpa.callstack.CallstackCPA,cpa.lock.LockCPA"
    - "cpa.usage.unsafedetector.ignoreEmptyLockset=false"
  benchmarks: test/programs/cpalockator/simple/*.c
  verdicts: ci-config/simple-test-verdicts.yml
  wip: false
lockStatistics-threadmodular-linux:
