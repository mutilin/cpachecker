Klever Testing-Requirement-specifications rcu:
  config: "-rcucpa"
  setprop: 
    - "cpa.callstack.unsupportedFunctions=__VERIFIER_nonexisting_dummy_function"
    - "cpa.predicate.allowedUnsupportedFunctions=memset,memcpy,__builtin_add_overflow,__builtin_mul_overflow,__builtin_va_arg"
    - "counterexample.export.extendedWitnessFile=witness.%d.graphml"
    - "cpa.arg.witness.removeInsufficientEdges=false"
    - "additionalCoverage.file=additionalCoverage.info"
    - "shutdown.timeout=100"
    - "counterexample.export.graphml=witness.%d.graphml"
  benchmarks: 
    - Linux-Testing-Requirement-specifications/*--concurrency-safety---rcu--*.i
  verdicts: ci-config/ldv-klever-verdicts.yml
  prefix: /opt/ldv-klever-benchmarks/