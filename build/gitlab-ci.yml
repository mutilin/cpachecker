# Build Docker images
# following this guideline: https://docs.gitlab.com/ee/ci/docker/using_kaniko.html
.build-docker:
  stage: images
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    EXTRA_ARGS: ""
  script:
    - mkdir -p /root/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --dockerfile $CI_PROJECT_DIR/$DOCKERFILE --destination $CI_REGISTRY_IMAGE$IMAGE $EXTRA_ARGS
  rules:
    - if: $ENABLE_DOCKER == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always

build-docker:base:
  extends: .build-docker
  variables:
    DOCKERFILE: build/gitlab-ci.Dockerfile.base.jdk-17
    IMAGE: /base:jdk-17
