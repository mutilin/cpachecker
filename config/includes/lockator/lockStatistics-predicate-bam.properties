# The configuration is used as a core configuration for lock analysis with BAM

#include lockStatistics-predicate.properties
#include lockStatistics-core-bam.properties

CompositeCPA.cpas = cpa.location.LocationCPA, cpa.callstack.CallstackCPA, cpa.thread.ThreadCPA, cpa.lock.LockCPA, cpa.predicate.BAMPredicateCPA
# , cpa.functionpointer.FunctionPointerCPA

cpa.lock.reduceLockCounters = BLOCK
cpa.lock.reduceUselessLocks = false

[cpa.predicate.bam]
useAbstractionReduction = false
usePrecisionReduction = false
